version: '3.8'

services:
    database:
        image: postgres:17.2-alpine
        volumes:
            - database:/var/lib/postgresql/data
        environment:
            - POSTGRES_PASSWORD=root
            - POSTGRES_USER=root
            - POSTGRES_DB=celosiajs_boilerplate
        healthcheck:
            test: ['CMD', 'pg_isready', '-d', 'db_prod']
        networks:
            - app
        ports:
            - 5432:5432

volumes:
    database:

networks:
    app:
